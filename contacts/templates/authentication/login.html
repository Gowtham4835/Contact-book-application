<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>
<div class="container mt-5" style="max-width: 450;">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <p class="mt-3"><a href="{% url 'authentication:password_reset' %}">Forgot your password?</a></p>
    <p class="mt-3">Don't have an account? <a href="{% url 'authentication:register' %}">Register </a></p>
</div>
</body>
</html>
