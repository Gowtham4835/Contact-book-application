<!DOCTYPE html>
<html lang="en">
<head>
    <title>Choose a new password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container mt-5" style="max-width: 520px;">
    {% if validlink %}
        <h1 class="h3">Choose a new password</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary" type="submit">Update password</button>
        </form>
    {% else %}
        <h1 class="h3">This reset link is invalid or expired</h1>
        <a href="{% url 'authentication:password_reset' %}">Request another link</a>
    {% endif %}
</main>
</body>
</html>
