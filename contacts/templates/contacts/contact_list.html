{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
 
    <title>Contact Book</title>
 
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css"
        rel="stylesheet"
    >
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >
</head>
<body>
<div class="container mt-5">
    <div class="d-flex justify-content-between mb-3">
        <h2>Contact Book</h2>
        <div class="d-flex align-items-center gap-3">
            <span>{{ request.user.email }}</span>
            <form method="post" action="{% url 'authentication:logout' %}">
                {% csrf_token %}
                <button class="btn btn-outline-secondary" type="submit">Log out</button>
            </form>
        </div>

        {% if perms.contacts.add_contact %}
        <button
            class="btn btn-primary"
            id="add-contact"
            type="button"
        >
            Add Contact
        </button>
        {% endif %}
    </div>
 
    <div id="message"></div>
 
    <table id="contacts-table" class="table table-striped w-100">
        <thead>
            <tr>
                <th>Name</th>
                <th>Phone Number</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
    </table>
</div>
 
<div class="modal fade" id="contact-modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-title">
                    Add Contact
                </h5>
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>
            </div>
 
            <div class="modal-body" id="contact-form-container">
                <!-- AJAX loads the form here -->
            </div>
        </div>
    </div>
</div>
 
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
<script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
 
<script>
    const contactUrls = {
        create: "{% url 'contacts:contact_create' %}",
        list: "{% url 'contacts:contact_list' %}",
        datatable: "{% url 'contacts:contact_datatable' %}"
    };
</script>

<script src="{% static 'contacts/contact.js' %}"></script>


</body>
</html>
